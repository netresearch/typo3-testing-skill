name: Skill Tests

# Runs tests/test_scripts.py, the behaviour tests for the shipped shell
# scripts (skills/typo3-testing/scripts/*.sh, Build/Scripts/*.sh with the
# Build/hooks that call them, scripts/verify-harness.sh) and the TT-106
# checkpoint, through the skill-repo-skill tests reusable. The suite is
# stdlib-only Python and needs php for generate-test.sh; the reusable runs it
# with python3 on ubuntu-latest and fails the job when it exits non-zero.
# require_tests makes the job fail if the glob ever matches no test file while
# the skill ships scripts.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    uses: netresearch/skill-repo-skill/.github/workflows/tests.yml@main
    permissions:
      contents: read
    with:
      python_glob: "tests/*.py"
      require_tests: true
